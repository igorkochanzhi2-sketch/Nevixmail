<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nevix Mail</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f0f12">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0f12; --sf: #1c1c21; --ln: #26262c; --mu: #9a9aa5;
    --ac: #d6283f; --at: #ff5468; --tx: #fff;
    --danger: #ff8b8b; --page: #050506; --write: #1f1518; --write2: #2a1b1f; --pill-bg: #2a1418;
    --chip-on: #2a1418; --sw-off: #3a3a42; --toast: #2b2b32; --av: #26262c;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f7f9; --sf: #ffffff; --ln: #e4e4ea; --mu: #6c6c78;
    --ac: #d6283f; --at: #c9152c; --tx: #12121a;
    --danger: #c62828; --page: #e9e9ee; --write: #ffeef0; --write2: #ffe3e7; --pill-bg: #ffe4e7;
    --chip-on: #ffe4e7; --sw-off: #cfcfd8; --toast: #2b2b32; --av: #ececf2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--tx);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app {
    width: 100%; max-width: 390px; height: 100%; max-height: 844px;
    background: var(--bg); display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  @media (min-width: 500px) { #app { border-radius: 36px; border: 1px solid var(--ln); height: 92vh; } }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .scr { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px; min-height: 0; overflow-y: auto; }
  .r { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .m { color: var(--mu); } .a { color: var(--at); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: 0.5px; }
  .logo b {
    color: #fff; font-size: 26px; width: 42px; height: 42px; border-radius: 13px;
    display: grid; place-items: center; flex: none;
    background: linear-gradient(160deg, #ff5555, #e0202b 55%, #b3121a);
    box-shadow: 0 10px 24px -14px rgba(255,59,59,0.9);
  }
  .i { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  .i:active { background: var(--sf); }
  .f {
    background: var(--sf); border-radius: 16px; padding: 0 16px; min-height: 56px;
    display: flex; align-items: center; gap: 8px; box-sizing: border-box;
  }
  .f input, .f textarea { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 16.5px; }
  .f:focus-within { outline: 2px solid var(--ac); }
  label { font-size: 13px; color: var(--mu); margin-bottom: 6px; display: block; }
  .b { background: var(--ac); color: #fff; border-radius: 16px; min-height: 56px; font-weight: 700; font-size: 17px; width: 100%; }
  .b:disabled { opacity: 0.55; }
  .b.g { background: var(--sf); color: var(--tx); }
  .err { color: var(--at); font-size: 14px; min-height: 18px; line-height: 1.35; }
  .pill { background: var(--pill-bg); color: var(--at); font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 14px; white-space: nowrap; }
  .write {
    background: var(--write); border-radius: 18px; min-height: 58px; display: flex; align-items: center;
    gap: 12px; padding: 0 16px; font-weight: 700; font-size: 19px; width: 100%; color: var(--tx);
  }
  :root:not([data-theme="light"]) .write { color: #fff; }
  .write svg { color: var(--at); }
  .write:active { background: var(--write2); }
  .item {
    display: flex; gap: 14px; text-align: left; width: 100%; padding: 14px 0;
    border-bottom: 1px solid var(--ln); align-items: flex-start;
  }
  .item:active { background: transparent; }
  .av {
    width: 48px; height: 48px; border-radius: 50%; background: var(--av); display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex: none;
  }
  .it { flex: 1; min-width: 0; }
  .it .t { font-size: 17.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .it .t span { font-size: 13.5px; font-weight: 400; color: var(--mu); flex: none; }
  .it .s { font-weight: 600; margin: 4px 0; }
  .it .p { color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b53; flex: none; align-self: center; }
  .nav { display: flex; justify-content: space-around; border-top: 1px solid var(--ln); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px) / 2); flex: none; background: var(--bg); }
  .nav button { width: 68px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--mu); }
  .nav .on { color: var(--at); }
  .row {
    display: flex; align-items: center; justify-content: space-between; min-height: 60px;
    border-bottom: 1px solid var(--ln); width: 100%; text-align: left; font-size: 16.5px;
  }
  .sw { width: 50px; height: 30px; border-radius: 15px; background: var(--sw-off); position: relative; flex: none; transition: background 0.15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: 0.15s; }
  .sw.on { background: var(--ac); }
  .sw.on::after { left: 23px; }
  .toast {
    position: absolute; left: 20px; right: 20px; bottom: 84px; background: var(--toast);
    border-radius: 14px; padding: 14px 16px; text-align: center; font-size: 15px; z-index: 20;
    box-shadow: 0 16px 40px -20px rgba(0,0,0,0.9); color: #fff;
  }
  button:focus-visible { outline: 2px solid var(--at); outline-offset: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; flex: none; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { height: 0; }
  .chip { padding: 0 14px; min-height: 40px; border-radius: 20px; background: var(--sf); color: var(--mu); white-space: nowrap; font-size: 15px; }
  .chip.on { background: var(--chip-on); color: var(--at); font-weight: 700; }
  .two { display: flex; gap: 10px; }

  /* свайпы по письму */
  .sw-item { position: relative; overflow: hidden; border-bottom: 1px solid var(--ln); }
  .sw-item .item { border-bottom: 0; position: relative; background: var(--bg); }
  .sw-item.sw-move .item { background: var(--bg); }
  .sw-bg {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    font-size: 14px; font-weight: 700; color: #fff; padding: 0 18px;
  }
  .sw-left { right: 0; justify-content: flex-end; background: #c62828; }
  .sw-right { left: 0; justify-content: flex-start; background: #1f7a3a; }
  .sw-fg { position: relative; touch-action: pan-y; will-change: transform; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
  </html>
